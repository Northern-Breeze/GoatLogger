# .github/workflows/publish.yml
name: Release & Publish

# This workflow runs when a pull request is merged into the 'main' branch.
# It uses 'Changesets' to manage versioning and changelogs.
on:
  push:
    branches:
      - main

# Define the minimum permissions needed for the workflow
permissions:
  contents: write # Required to create releases and push tags
  pull-requests: write # Required to create/update the Release PR
  id-token: write # Required for provenance when publishing to npm

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    # Do not run on forks
    if: github.repository_owner == 'goatlogger'

    steps:
      - name: 🐐 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for accurate changelogs
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          # Cache npm dependencies for faster runs
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✨ Run Linting
        run: npm run lint
        continue-on-error: false # Block release if linting fails

      - name: 🧪 Run Tests
        run: npm test
        continue-on-error: false # Block release if tests fail

      - name: 🏗️ Build SDK
        run: npm run build
        # Ensure the build script (e.g., tsc) generates the 'dist' or 'lib' folder

      # We use Changesets to manage the release process.
      # Step 1: Check if this push contains a version update.
      - name: 🔄 Create Release Pull Request or Publish
        id: changesets
        uses: changeset/action@v1
        with:
          # This automatically creates/updates a special "Release PR"
          # when new changesets are detected on 'main'.
          # When that PR is merged, it triggers the publishing step below.
          publish: npm run release:publish
          version: npm run release:version
          title: "🚀 Release: Version Packages"
          commit: "chrono(release): version packages 🐐"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Step 2: If the Changeset action ran 'publish', generate a GitHub Release.
      - name: 📝 Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Use the tag generated by Changesets
          tag_name: ${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}
          name: "🐐 GoatLogger SDK v${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}"
          # Automatically generate the body from the CHANGELOG.md
          body: ${{ fromJson(steps.changesets.outputs.publishedPackages)[0].changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Security scanning job (highly recommended for modern SDKs)
  security-scan:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
